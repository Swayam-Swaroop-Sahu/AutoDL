<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>ExplainDL Report</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>ExplainDL Automated Analysis Report</h1>
<p class="meta">Model: {{ metadata.model_name }} | Type: {{ metadata.data_type }} | Date: {{ metadata.saved_at }}</p>

<h2>Performance Summary</h2>
<table>
    {% for m, v in metrics.items() %}
    <tr><td>{{ m }}</td><td>{{ v }}</td></tr>
    {% endfor %}
</table>

<h2>Explainability Visuals</h2>

{% for img in explainability_images %}
<div class="image-block">
    <img src="{{ img }}" />
</div>
{% endfor %}

</body>
</html>
